services:
  app:
    build: .
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_PORT: ${APP_PORT}
      APP_USER_SESSION_TTL: ${APP_USER_SESSION_TTL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      MONGODB_EVENTHUB_DATABASE: ${MONGODB_EVENTHUB_DATABASE}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
      APP_LIKE_TTL: ${APP_LIKE_TTL}
      CASSANDRA_HOSTS: ${CASSANDRA_HOSTS}
      CASSANDRA_PORT: ${CASSANDRA_PORT}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
      CASSANDRA_CONSISTENCY: ${CASSANDRA_CONSISTENCY}
    depends_on:
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      mongo-cluster-init:
        condition: service_completed_successfully

  configsvr:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--configsvr", "--replSet", "cfg", "--port", "27019"]
    volumes:
      - mongo-config-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27019", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shard1-primary:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--shardsvr", "--replSet", "shard1", "--port", "27018"]
    volumes:
      - mongo-shard1-primary-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shard1-secondary1:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--shardsvr", "--replSet", "shard1", "--port", "27018"]
    volumes:
      - mongo-shard1-secondary1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shard1-secondary2:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--shardsvr", "--replSet", "shard1", "--port", "27018"]
    volumes:
      - mongo-shard1-secondary2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shard2-primary:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--shardsvr", "--replSet", "shard2", "--port", "27018"]
    volumes:
      - mongo-shard2-primary-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shard2-secondary1:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--shardsvr", "--replSet", "shard2", "--port", "27018"]
    volumes:
      - mongo-shard2-secondary1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shard2-secondary2:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--shardsvr", "--replSet", "shard2", "--port", "27018"]
    volumes:
      - mongo-shard2-secondary2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-rs-init:
    image: mongo:7
    depends_on:
      configsvr:
        condition: service_healthy
      shard1-primary:
        condition: service_healthy
      shard1-secondary1:
        condition: service_healthy
      shard1-secondary2:
        condition: service_healthy
      shard2-primary:
        condition: service_healthy
      shard2-secondary1:
        condition: service_healthy
      shard2-secondary2:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/mongo-rs-init.sh:/mongo-rs-init.sh:ro
    command: ["bash", "/mongo-rs-init.sh"]

  mongos:
    image: mongo:7
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    command: ["mongos", "--bind_ip_all", "--configdb", "cfg/configsvr:27019", "--port", "27017"]
    ports:
      - "${MONGODB_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "${MONGODB_PORT}", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-cluster-init:
    image: mongo:7
    depends_on:
      mongos:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/mongo-cluster-init.sh:/mongo-cluster-init.sh:ro
    command: ["bash", "/mongo-cluster-init.sh"]

  redis:
    image: redis:8-alpine
    command: redis-server --port ${REDIS_PORT}
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cassandra-test:
    image: cassandra:4.1
    ports:
      - "${CASSANDRA_PORT}:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra-test:
        condition: service_healthy
    environment:
      CASSANDRA_HOST: cassandra-test
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
    volumes:
      - ./docker/cassandra-init.sh:/cassandra-init.sh:ro
    command: ["bash", "/cassandra-init.sh"]
    restart: "no"

volumes:
  mongo-config-data:
  mongo-shard1-primary-data:
  mongo-shard1-secondary1-data:
  mongo-shard1-secondary2-data:
  mongo-shard2-primary-data:
  mongo-shard2-secondary1-data:
  mongo-shard2-secondary2-data:
